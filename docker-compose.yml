networks:
  ichub_films_net:
    external: true

volumes:
  mongo_data:
  tempo_data:
  loki_data:
  alloy_data:
  grafana_data:

services:
  # MongoDB хранит данные приложения о фильмах.
  mongo:
    image: mongo:7
    container_name: films_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ichub_films_net

  # Основной API-сервис приложения, обрабатывающий запросы к каталогу фильмов.
  app:
    build:
      context: .
      dockerfile: deployment/local.Dockerfile
    container_name: app
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8000}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-films-api}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-otlp}"
      OTEL_METRICS_EXPORTER: "${OTEL_METRICS_EXPORTER:-none}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
      - otel-collector
    networks:
      - ichub_films_net

  # OpenTelemetry Collector принимает трейсы приложения и передаёт их в Tempo.
  otel-collector:
    image: otel/opentelemetry-collector:0.132.0
    container_name: films_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployment/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
    networks:
      - ichub_films_net

  # Tempo хранит распределённые трейсы для анализа запросов и производительности.
  tempo:
    image: grafana/tempo:2.10.7
    container_name: films_tempo
    user: "0"
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deployment/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - ichub_films_net

  # Loki хранит и индексирует логи контейнеров приложения.
  loki:
    image: grafana/loki:3.7.0
    container_name: films_loki
    user: "0"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deployment/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/var/loki
    networks:
      - ichub_films_net

  # Grafana Alloy собирает логи Docker-контейнеров и отправляет их в Loki.
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: films_alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deployment/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks:
      - ichub_films_net

  # Grafana предоставляет веб-интерфейс для просмотра логов из Loki и трейсов из Tempo.
  grafana:
    image: grafana/grafana:13.1.0
    container_name: films_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./deployment/grafana/provisioning/datasources/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
      - ./deployment/grafana/provisioning/datasources/loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo
      - loki
    networks:
      - ichub_films_net
